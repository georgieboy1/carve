<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf3f8">
  <title>Carve — Collection — KG Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #4a3b49;
      --ink-soft: #9c8a97;
      --mint: #7fb2a6;
      --rose: #ff6b8a;
    }

    body {
      min-height: 100dvh;
      background:
        radial-gradient(110% 40% at 50% 4%, #fffdfe 0%, #fdf3f8 45%, transparent 100%),
        linear-gradient(180deg, #fdf3f8 0%, #f6e9f3 70%, #eddfec 100%);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      padding: 16px 14px calc(30px + env(safe-area-inset-bottom));
    }

    #top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 2px;
    }

    #top h1 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; }

    #tally {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }

    #back {
      display: inline-block;
      margin-bottom: 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--mint);
      text-decoration: none;
    }

    .pack {
      margin-bottom: 14px;
      padding: 10px 8px 4px;
      border-radius: 18px;
    }

    .pack-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 2px;
      padding: 0 2px;
    }

    .pack-head b {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #a1889c;
    }

    .tally {
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }

    .unlock {
      border: 0;
      border-radius: 99px;
      padding: 6px 13px;
      background: var(--mint);
      color: #fff;
      font: inherit;
      font-size: 10.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .unlock:active { transform: scale(.95); }

    .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      gap: 0 2px;
    }

    .tile {
      border: 0;
      background: none;
      font: inherit;
      color: inherit;
      text-align: center;
      padding: 0 0 8px;
      border-radius: 14px;
    }

    .tile img { display: block; width: 100%; height: auto; }

    .tile figcaption { margin-top: -10px; }

    .tile b { display: block; font-size: 11.5px; font-weight: 700; }
    .tile b.dim { color: #c2b0bd; }

    .tile .todo {
      font-size: 9.5px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #c2b0bd;
    }

    .tile .score { font-size: 12px; letter-spacing: 1px; }
    .star { color: #e8dce3; }
    .star.full { color: #f0b73f; }
    .star.half {
      background: linear-gradient(90deg, #f0b73f 50%, #e8dce3 50%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }

    .zen {
      font-style: normal; font-size: 9.5px; font-weight: 800;
      letter-spacing: .09em; text-transform: uppercase; color: #4f8d7d;
    }

    .playable { cursor: pointer; transition: background .18s ease, transform .12s ease; }
    .playable:hover { background: rgba(255,255,255,.5); }
    .playable:active { transform: scale(.96); }
    .playable:focus-visible { outline: 2px solid var(--mint); outline-offset: -2px; }

    footer {
      margin-top: 18px;
      font-size: 10px;
      letter-spacing: .3em;
      text-indent: .3em;
      text-align: center;
      color: #bda9b8;
    }

    footer b { font-weight: 800; color: #a1889c; }
  </style>
</head>
<body>
  <div id="top">
    <h1>Collection</h1>
    <span id="tally">–</span>
  </div>
  <a id="back" href="./">&larr; Back to carving</a>

  <div id="shelf"></div>

  <footer><b>KG</b> STUDIO &middot; <a href="privacy.html">Privacy</a></footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="gallery.js?v=3"></script>
</body>
</html>
