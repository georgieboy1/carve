<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf3f8">
  <title>Carve — prototype — KG Studio</title>
  <link rel="stylesheet" href="carve.css">
</head>
<body>
  <header id="hud">
    <div id="hud-top">
      <div id="hearts"></div>
      <div id="level-tag">
        <span id="level-name">–</span>
        <span id="pips" aria-hidden="true"></span>
      </div>
    </div>

    <div id="progress">
      <div id="progress-label">
        <span>Blocks to carve</span>
        <span id="left">–</span>
      </div>
      <div id="progress-track"><div id="progress-fill"></div></div>
    </div>
  </header>

  <main id="stage"></main>

  <div id="hint">Drag to spin &middot; Tap to carve &middot; Hold to keep</div>

  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Thumb-reachable, and labelled in words: an icon meaning three
       different things is the wrong call for a working-memory problem. -->
  <div id="controls">
    <button id="clue-btn" class="pill" type="button">Clues</button>
    <button id="hint-btn" class="pill" type="button">Hint</button>
  </div>

  <div id="banner" hidden>
    <div id="banner-card">
      <div id="banner-emoji">✨</div>
      <h2 id="banner-title">Pyramid revealed</h2>
      <p id="banner-body"></p>
      <button id="ad-btn" class="btn" type="button" hidden></button>
      <button id="again" class="btn btn-ghost" type="button">Next level</button>
    </div>
  </div>

  <footer id="brand"><b>KG</b> STUDIO &middot; PROTOTYPE</footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="carve.js"></script>
</body>
</html>
