<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carve — level catalogue — KG Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(110% 55% at 50% 8%, #fffdfe 0%, #fdf3f8 45%, transparent 100%),
        linear-gradient(180deg, #fdf3f8 0%, #f6e9f3 70%, #eddfec 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #4a3b49;
      -webkit-font-smoothing: antialiased;
      padding: 22px 24px 34px;
    }

    header { text-align: center; margin-bottom: 18px; }

    h1 { font-size: 20px; font-weight: 800; letter-spacing: -.01em; }

    header p {
      font-size: 12.5px;
      color: #9c8a97;
      margin-top: 5px;
    }

    #wrap { position: relative; max-width: 1180px; margin: 0 auto; }

    canvas { display: block; width: 100%; border-radius: 18px; }

    /* Labels ride over the canvas on the same grid the scissor views use. */
    #labels {
      position: absolute;
      inset: 0;
      display: grid;
      pointer-events: none;
    }

    .cell {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 6px;
      text-align: center;
    }

    .cell b {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: .01em;
    }

    .cell span {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #b6a4b2;
      margin-top: 1px;
    }

    .cell i {
      font-style: normal;
      font-size: 10px;
      color: #c2b0bd;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    footer {
      max-width: 1180px;
      margin: 20px auto 0;
      font-size: 11px;
      letter-spacing: .28em;
      text-indent: .28em;
      text-align: center;
      color: #bda9b8;
    }

    footer b { font-weight: 800; color: #a1889c; }
  </style>
</head>
<body>
  <header>
    <h1>Carve — level catalogue</h1>
    <p>Every shape below is authored as a stack of text maps and machine-checked to stand on its own.</p>
  </header>

  <div id="wrap">
    <canvas id="view"></canvas>
    <div id="labels"></div>
  </div>

  <footer><b>KG</b> STUDIO</footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="catalogue.js"></script>
</body>
</html>
