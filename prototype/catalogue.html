<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carve — level catalogue — KG Studio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(110% 45% at 50% 4%, #fffdfe 0%, #fdf3f8 45%, transparent 100%),
        linear-gradient(180deg, #fdf3f8 0%, #f6e9f3 70%, #eddfec 100%);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #4a3b49;
      -webkit-font-smoothing: antialiased;
      padding: 24px 20px 40px;
    }

    header { text-align: center; margin-bottom: 22px; }

    h1 { font-size: 21px; font-weight: 800; letter-spacing: -.01em; }

    header p { font-size: 12.5px; color: #9c8a97; margin-top: 5px; }

    #summary {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 13px;
      border-radius: 99px;
      background: rgba(255,255,255,.6);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .04em;
      color: #a1889c;
    }

    #grid {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 4px 8px;
    }

    .tile { text-align: center; padding-bottom: 10px; }

    .tile img {
      display: block;
      width: 100%;
      height: auto;
      /* The render is transparent, so no plate is needed behind it. */
    }

    figcaption { margin-top: -14px; }

    .tile b { display: block; font-size: 12.5px; font-weight: 700; }

    .tile span {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #b6a4b2;
      margin-top: 1px;
    }

    .tile i {
      display: block;
      font-style: normal;
      font-size: 10px;
      color: #c2b0bd;
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }

    footer {
      max-width: 1200px;
      margin: 26px auto 0;
      font-size: 11px;
      letter-spacing: .28em;
      text-indent: .28em;
      text-align: center;
      color: #bda9b8;
    }

    footer b { font-weight: 800; color: #a1889c; }
  </style>
</head>
<body>
  <header>
    <h1>Carve — level catalogue</h1>
    <p>Every shape is authored as a stack of text maps and machine-checked to stand on its own.</p>
    <span id="summary">…</span>
  </header>

  <div id="grid"></div>

  <footer><b>KG</b> STUDIO</footer>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="catalogue.js?v=5"></script>
</body>
</html>
